<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Buff Timer Einstellungen</title>
    <style>
      body { font-family: Arial, sans-serif; color: #e5e7eb; background: #111827; margin: 16px; }
      label { display:block; margin-top:10px; font-size:12px; }
      input { width:100%; padding:6px; margin-top:4px; box-sizing:border-box; }
      .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      .hint { color:#9ca3af; font-size:11px; margin-top:6px; line-height:1.35; }
      .panel { background:#1f2937; border-radius:8px; padding:10px; margin-top:10px; }
    </style>
  </head>
  <body>
    <div class="panel hint">
      Diese Action ist eine reine Anzeige-/Timer-Action. Für Tastenkombinationen bitte in Stream Deck
      eine <strong>Multi Action</strong> verwenden: zuerst <strong>Hotkey</strong>, danach diese Action.
    </div>

    <label>Icon A (Start, statisch)
      <input id="iconA" type="text" />
    </label>
    <label>Icon B
      <input id="iconB" type="text" />
    </label>
    <label>Icon C
      <input id="iconC" type="text" />
    </label>
    <div class="hint">Pfad relativ zum Plugin (z.B. images/state-b.svg) oder data:image/... URI.</div>

    <div class="row">
      <label>Timer B (Sek.)
        <input id="timerBSeconds" type="number" min="1" />
      </label>
      <label>Blink B (Hz, 1-3)
        <input id="blinkBHz" type="number" min="1" max="3" step="0.1" />
      </label>
    </div>
    <label>Blinken in B aktiv (1=true, 0=false)
      <input id="blinkBEnabled" type="number" min="0" max="1" step="1" />
    </label>

    <div class="row">
      <label>Timer C (Sek.)
        <input id="timerCSeconds" type="number" min="1" />
      </label>
      <label>Blink C (Hz, 1-3)
        <input id="blinkCHz" type="number" min="1" max="3" step="0.1" />
      </label>
    </div>
    <label>Blinken in C aktiv (1=true, 0=false)
      <input id="blinkCEnabled" type="number" min="0" max="1" step="1" />
    </label>

    <script src="index.js"></script>
  </body>
</html>
